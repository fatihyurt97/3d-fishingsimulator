<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Göl Avcısı">
  <meta name="theme-color" content="#0b1d2a">
  <meta name="description" content="3 boyutlu göl balıkçılığı oyunu. iPad, Mac ve iPhone'da çalışır.">
  <title>Göl Avcısı</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="top-left">
      <div class="chip" id="money">60 ₺</div>
      <div class="chip" id="clock">07:00</div>
      <div class="chip" id="weather">☀ Açık</div>
    </div>

    <div class="top-right">
      <button class="icon-btn" id="btn-shop" aria-label="Dükkân">🛒<span>Dükkân</span></button>
      <button class="icon-btn" id="btn-bag" aria-label="Çanta">🎣<span>Çanta <em id="bag-count">0/10</em></span></button>
      <button class="icon-btn" id="btn-book" aria-label="Balık kitabı">📖<span>Kitap</span></button>
      <button class="icon-btn" id="btn-settings" aria-label="Ayarlar">⚙️</button>
    </div>

    <div id="hint" class="hint"></div>

    <button class="bait" id="bait-btn" aria-label="Yem değiştir">
      <span class="bait-label">Yem</span>
      <span id="bait-name">Solucan</span>
      <span id="bait-count">× 15</span>
    </button>

    <div id="pull" class="pull">
      <div class="pull-track"><div id="pull-fill"></div></div>
      <span>GÜÇ</span>
    </div>

    <div id="bite" class="bite">
      <div class="excl">!</div>
      <div class="bite-text">ŞİMDİ VUR!</div>
    </div>

    <div id="fight" class="fight">
      <div class="fight-head">
        <span>Gerilim</span>
        <span id="reel-state">serbest</span>
      </div>
      <div class="fight-body">
        <div class="tension">
          <div class="tension-band"></div>
          <div id="tension-fill"></div>
        </div>
        <div class="dist">
          <span id="dist-text">0 m</span>
          <div class="dist-bar"><div id="dist-fill"></div></div>
          <span class="dist-cap">kıyıya</span>
        </div>
      </div>
    </div>

    <div id="toast" class="toast"></div>
  </div>

  <div id="modal" class="modal">
    <div id="modal-card" class="card-modal">
      <header>
        <h2 id="modal-title"></h2>
        <button id="modal-close" class="x" aria-label="Kapat">✕</button>
      </header>
      <div id="modal-body"></div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
